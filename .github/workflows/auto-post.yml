name: Auto post
on:
  schedule:
    - cron: "0 6 */3 * *"   # every 3 days at 06:00 UTC (keeps Netlify free credits safe)
  workflow_dispatch:         # lets you run it by hand
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: findfunaround
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/generate.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          POSTS_PER_RUN: "6"
      - name: Commit new posts
        run: |
          git config user.name "auto-blog"
          git config user.email "auto-blog@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "New posts" && git push)
